[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niiflow-train"
version = "0.1.0"
description = "Training and fine-tuning brain MRI foundation models (MONAI + PyTorch Lightning)."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "Petros Koutsouvelis" }]
keywords = [
    "nifti",
    "neuroimaging",
    "MRI",
    "deep-learning",
    "pytorch",
    "monai",
    "lightning",
    "training",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "nifti-finder>=2.0.0,<3.0.0",
    "lightning>=2.5.5,<3.0.0",
    "monai>=1.5.0,<2.0.0",
    "numpy>=2.3.5,<3.0.0",
    "torch>=2.9.1,<3.0.0",
    "wandb>=0.23.0,<1.0.0",
    "matplotlib>=3.10.7,<4.0.0",
    "PyYAML>=6.0.2,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/pkoutsouvelis/niiflow"
Repository = "https://github.com/pkoutsouvelis/niiflow"
Issues = "https://github.com/pkoutsouvelis/niiflow/issues"
Documentation = "https://github.com/pkoutsouvelis/niiflow/tree/main/packages/niiflow-train"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["niiflow*"]
namespaces = true
