[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niiflow-preproc"
version = "0.1.0"
description = "Offline preprocessing workflows for niiflow (heavy / optional deps isolated from training)."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "Petros Koutsouvelis" }]
dependencies = [
    "numpy>=2.3.5,<3.0.0",
    "nibabel>=5.0.0,<6.0.0",
    "PyYAML>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
# ANTs-backed pipelines: add when you wire antspyx; keeps default install light.
ants = []
test = ["pytest>=7.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["niiflow*"]
namespaces = true
