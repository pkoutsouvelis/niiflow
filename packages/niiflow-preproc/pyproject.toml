[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niiflow-preproc"
version = "0.2.0"
description = "Offline preprocessing workflows for niiflow (heavy / optional deps isolated from training)."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "Petros Koutsouvelis" }]
dependencies = [
    "numpy>=2.3.5,<3.0.0",
    "nibabel>=5.0.0,<6.0.0",
    "PyYAML>=6.0.2,<7.0.0",
    "antspyx>=0.6.1,<0.7.0",
    "antspynet>=0.3.2,<0.4.0",
    "duckdb>=1.1.0,<2.0.0",
    "nifti-finder>=2.0.0,<3.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "scipy>=1.14,<2.0",
]

[project.scripts]
niiflow-preproc = "niiflow.preproc.cli.main:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["niiflow*"]
namespaces = true
