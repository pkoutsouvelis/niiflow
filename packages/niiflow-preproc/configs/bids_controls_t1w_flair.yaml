# BIDS explorer: healthy-control T1w images that also have a FLAIR companion.
# QC gates skull-stripping; FileStager resolves derivative output paths.
#
# Usage:
#   niiflow-preproc dynamic_workflow configs/bids_controls_t1w_flair.yaml
#
# Modes (set in this file, not via CLI flags):
#   plan_only: true          # discover + stage only
#   dry_run: true            # print plan; do not save or execute
#   from_plan: /path/plan.duckdb   # skip planning; execute saved plan

settings:
  num_workers: auto
  logs_root: /data/logs
  staging_params:
    stager_name: FileStager
    params:
      pointers:
        steps.qc.params.image: input
        steps.qc.save_outputs.report: output
        steps.strip.params.image: input
        steps.strip.save_outputs.out_image: output
        steps.strip.save_outputs.brain_mask: output
  pipeline_params:
    verbose: true
    steps:
      qc:
        name: CheckVoxelSpacing
        params:
          image: "{active}"
          expected: [1.0, 1.0, 1.0]
          op: "<="
          id: "ctx.run_id"
          log: true
        save_outputs:
          report:
            root:
              mode: parent_match
              value: anat
              mirror:
                source: rawdata
                target: derivatives/niiflow/qc
            name: "{active.stem}_qc_spacing.json"
      strip:
        name: ANTsBrainExtraction
        params:
          image: "{active}"
          modality: t1
          enable: "ctx.outputs.qc.passed"
        save_outputs:
          out_image:
            root:
              mode: parent_match
              value: anat
              mirror:
                source: rawdata
                target: derivatives/niiflow
            name: "{active.name|strip:_T1w.nii.gz}_desc-brain_T1w.nii.gz"
          brain_mask:
            root:
              mode: parent_match
              value: anat
              mirror:
                source: rawdata
                target: derivatives/niiflow
            name: "{active.name|strip:_T1w.nii.gz}_desc-brain_mask.nii.gz"
    order: [qc, strip]

inputs:
  mode: search
  roots: /Users/P70090502/Documents/projects/SynthFCD/synthFCD/example_data/SASHIMI_examples
  explorer_params:
    patterns: "**/anat/*T1w.nii*"
    filters:
      name: ComposeFilter
      kwargs:
        logic: AND
        filters:
          - name: IncludeFromTable
            kwargs:
              table_path: /root/of/BIDS/dataset/participants.tsv
              id_column: dataset_subject_session
              criteria_column: group
              criteria_value: Control
              id_pattern: "{id}"
          - name: IncludeIfFileExists
            kwargs:
              filename_pattern: "*FLAIR.nii*"

save_filepaths_to: /data/files/controls
save_plan_to: /data/plans/controls.duckdb
