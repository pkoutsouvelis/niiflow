[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niiflow"
version = "0.1.0"
description = "niiflow — configurable workflows for deep learning-based neuroimaging analyses (meta package)."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "Petros Koutsouvelis" }]
dependencies = [
    "niiflow-core",
    "niiflow-preproc",
]

[project.scripts]
niiflow = "niiflow.__main__:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.uv.sources]
niiflow-core = { workspace = true }
niiflow-preproc = { workspace = true }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["niiflow*"]
namespaces = true
