[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niiflow"
version = "0.1.0"
description = "niiflow - Configurable workflows for deep learning-based neuroimaging analyses."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Petros Koutsouvelis"},
]
dependencies = [
    "nifti-finder>=1.1.0,<2.0.0",
    "lightning>=2.5.5,<3.0.0",
    "monai>=1.5.0,<2.0.0",
    "numpy>=2.3.5,<3.0.0",
    "torch>=2.9.1,<3.0.0",
    "wandb>=0.23.0,<1.0.0",
    "matplotlib>=3.10.7,<4.0.0",
    "PyYAML>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
dev = [
    "jupyter>=1.0.0",
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine",
]

[project.scripts]
niiflow = "niiflow.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["niiflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "viz: marks tests as visualization-only (deselect with '-m \"not viz\"')",
    "serial",
]
addopts = "-m 'not viz'"

[tool.black]
line-length = 88
target-version = ["py39"]