# Virtual workspace root: not published to PyPI. Installable distributions live under packages/.
# Develop with: `uv sync` then `uv run pytest` (or activate `.venv`).

[project]
name = "niiflow-workspace"
version = "0.0.0"
description = "Development workspace for the niiflow monorepo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Petros Koutsouvelis" }]
dependencies = [
    "niiflow",
]

[tool.uv.sources]
niiflow = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/niiflow-core",
    "packages/niiflow-preproc",
    "packages/niiflow",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "black>=24.0",
    "docformatter>=1.7.0",
    "interrogate>=1.7.0",
    "mypy",
    "jupyter>=1.0.0",
    "build",
    "twine",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/niiflow-core/tests",
    "packages/niiflow-preproc/tests",
    "packages/niiflow/tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: real ANTs / end-to-end stage tests (deselect with '-m \"not integration\"')",
    "viz: marks tests as visualization-only (deselect with '-m \"not viz\"')",
    "serial",
]
addopts = "-m 'not viz'"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.interrogate]
# Docstring coverage (modules / classes / methods). Adjust fail-under as the codebase grows.
fail-under = 100
ignore-init-method = true
ignore-init-module = false
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = false
exclude = ["tests", "build", "dist", ".venv", ".git"]
verbose = 1
color = true
